<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الحضور والغياب - مدرسة الشمامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --absent-bg: #fee2e2;
            --absent-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
        }

        .back-btn {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 16px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 36px auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-main);
            text-align: center;
        }

        /* Tab Switcher Navigation */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Table Card Container */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:first-child, td:first-child {
            text-align: right;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        /* Optional Badge Styling for Attendance marks if text contains P/A or similar */
        .status-present {
            background-color: var(--success-bg);
            color: var(--success-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }

        .status-absent {
            background-color: var(--absent-bg);
            color: var(--absent-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
        }

        .loading-msg, .error-msg {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
        }

        .error-msg {
            color: #dc2626;
        }

        /* Scrollbar styling */
        .table-card::-webkit-scrollbar {
            height: 8px;
        }
        .table-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="deacons.html" class="back-btn">⬅ عودة لقسم الشمامسة</a>
        <h2 style="font-size: 18px; color: var(--primary);">مدرسة الشمامسة</h2>
        <div></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1 class="page-title">سجل الحضور والغياب</h1>

        <!-- Dynamically Loaded Tabs -->
        <div class="tabs-nav" id="tabsNav">
            <p class="loading-msg" style="padding: 0;">جاري تحميل الأقسام...</p>
        </div>

        <!-- Attendance Data Table Area -->
        <div class="table-card" id="tableContainer">
            <p class="loading-msg">اختر قسماً لعرض البيانات...</p>
        </div>
    </div>

    <!-- Load Deacons Config -->
    <script src="deacons-config.js"></script>
    <script>
        let currentTab = '';

        async function fetchTabs() {
            const tabsNav = document.getElementById('tabsNav');
            try {
                const response = await fetch(`${DEACON_CONFIG.WEB_APP_URL}?action=getAttendanceTabs`);
                const result = await response.json();

                if (result.status === "success" && result.tabs && result.tabs.length > 0) {
                    let html = '';
                    result.tabs.forEach((tabName, index) => {
                        const activeClass = index === 0 ? 'active' : '';
                        if (index === 0) currentTab = tabName;
                        
                        html += `<button class="tab-btn ${activeClass}" onclick="switchTab('${tabName.replace(/'/g, "\\'")}', this)">${tabName}</button>`;
                    });
                    tabsNav.innerHTML = html;

                    if (currentTab) {
                        loadAttendanceData(currentTab);
                    }
                } else {
                    tabsNav.innerHTML = `<p class="error-msg">لم يتم العثور على أوراق عمل في الملف.</p>`;
                }
            } catch (err) {
                console.error("Error fetching tabs:", err);
                tabsNav.innerHTML = `<p class="error-msg">فشل الاتصال بجلب الأقسام.</p>`;
            }
        }

        async function loadAttendanceData(tabName) {
            const container = document.getElementById('tableContainer');
            container.innerHTML = `<p class="loading-msg">جاري تحميل بيانات ${tabName}...</p>`;

            try {
                const response = await fetch(`${DEACON_CONFIG.WEB_APP_URL}?action=getAttendance&tabName=${encodeURIComponent(tabName)}`);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    let rows = result.data;
                    let html = '<table>';
                    
                    rows.forEach((row, rowIndex) => {
                        html += '<tr>';
                        row.forEach(cell => {
                            let cellContent = cell !== "" ? cell : '-';
                            
                            // Optional smart styling for checkmarks or attendance signs if you use them
                            if (rowIndex === 0) {
                                html += `<th>${cellContent}</th>`;
                            } else {
                                html += `<td>${cellContent}</td>`;
                            }
                        });
                        html += '</tr>';
                    });
                    
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="error-msg">لا توجد بيانات متاحة في هذا الجدول.</p>`;
                }
            } catch (err) {
                console.error("Error loading attendance:", err);
                container.innerHTML = `<p class="error-msg">حدث خطأ أثناء الاتصال بالخادم.</p>`;
            }
        }

        function switchTab(tabName, btnElement) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            loadAttendanceData(tabName);
        }

        window.onload = function() {
            fetchTabs();
        };
    </script>

</body>
</html>
