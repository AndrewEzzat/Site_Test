<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الحضور - مدرسة الشمامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
            text-align: center;
        }

        /* Tab Switcher Buttons */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Table Card Container */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 700;
        }

        tr:hover {
            background: #f8fafc;
        }

        .loading-msg, .error-msg {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .error-msg {
            color: #dc2626;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="deacons.html" class="back-btn">⬅ عودة لقسم الشمامسة</a>
        <h2 style="font-size: 16px; color: var(--primary);">سجل الحضور والغياب</h2>
        <div></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <h1 class="page-title">متابعة حضور فصول الشمامسة</h1>

        <!-- Tab Selection Buttons matching your sheet tabs -->
        <div class="tabs-nav" id="tabsNav">
            <button class="tab-btn active" onclick="switchTab('غما 1', this)">غما 1</button>
            <button class="tab-btn" onclick="switchTab('غما 2', this)">غما 2</button>
            <button class="tab-btn" onclick="switchTab('غما 3', this)">غما 3</button>
        </div>

        <!-- Attendance Data Table Area -->
        <div class="table-card" id="tableContainer">
            <p class="loading-msg">جاري تحميل بيانات الحضور...</p>
        </div>
    </div>

    <!-- Load Deacons Config -->
    <script src="deacons-config.js"></script>
    <script>
        let currentTab = 'غما 1';

        async function loadAttendanceData(tabName) {
            const container = document.getElementById('tableContainer');
            container.innerHTML = `<p class="loading-msg">جاري تحميل بيانات ${tabName}...</p>`;

            try {
                const response = await fetch(`${DEACON_CONFIG.WEB_APP_URL}?action=getAttendance&tabName=${encodeURIComponent(tabName)}`);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    let rows = result.data;
                    let html = '<table>';
                    
                    rows.forEach((row, rowIndex) => {
                        html += '<tr>';
                        row.forEach(cell => {
                            if (rowIndex === 0) {
                                html += `<th>${cell !== "" ? cell : '-'}</th>`;
                            } else {
                                html += `<td>${cell !== "" ? cell : '-'}</td>`;
                            }
                        });
                        html += '</tr>';
                    });
                    
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = `<p class="error-msg">لا توجد بيانات متاحة في هذا الجدول أو تعذر العثور على الورقة.</p>`;
                }
            } catch (err) {
                console.error("Error loading attendance:", err);
                container.innerHTML = `<p class="error-msg">حدث خطأ أثناء الاتصال بالخادم. تأكد من إعدادات الـ Web App.</p>`;
            }
        }

        function switchTab(tabName, btnElement) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            loadAttendanceData(tabName);
        }

        // Load default tab on page load
        window.onload = function() {
            loadAttendanceData(currentTab);
        };
    </script>

</body>
</html>
