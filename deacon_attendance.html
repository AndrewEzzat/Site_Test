<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>سجل الحضور والغياب - مدرسة الشمامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="deacon_attendance.css">
</head>
<body>

    <div class="header">
        <a href="deacons.html" class="back-btn">⬅ عودة</a>
        <h2>سجل الحضور والغياب</h2>
        <div style="width: 40px;"></div>
    </div>

    <div class="container">
        <div id="authSection" class="auth-card">
            <h3>🔒 يرجى إدخال كلمة المرور</h3>
            <input type="password" id="passwordInput" placeholder="كلمة المرور" autofocus>
            <button onclick="authenticate()">دخول</button>
            <p id="authError" class="error-msg" style="display:none; padding:8px 0 0 0;"></p>
        </div>

        <div id="attendanceSection" style="display: none;">
            <div class="tabs-nav" id="tabsNav"></div>
            <div class="table-card" id="tableContainer"></div>
        </div>
    </div>

    <script src="deacons-config.js"></script>
    <script src="deacon_attendance.js"></script>
</body>
</html>
