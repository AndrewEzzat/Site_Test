<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناهج القبطي - مدرسة الشمامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        /* Container for the Drive embed frame */
        .drive-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 61px);
            background: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="deacons.html" class="back-btn">⬅ عودة لقسم الشمامسة</a>
        <h2 style="font-size: 16px; color: var(--primary);">مناهج اللغة القبطية</h2>
        <div></div>
    </div>

    <!-- Embedded Google Drive Folder View -->
    <div class="drive-container">
        <iframe src="https://drive.google.com/embeddedfolderview?id=1vJY6ni57Unq1rxJCvQDbG6LEkA_ZeBuL#grid"></iframe>
    </div>

</body>
</html>
