<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناهج القبطي - مدرسة الشمامسة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 61px);
            overflow: hidden;
        }

        /* Sidebar for Dynamic Files */
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-left: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .item-btn {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: right;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .item-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Content Viewer Area */
        .viewer-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e2e8f0;
            position: relative;
        }

        .viewer-toolbar {
            background: #ffffff;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewer-toolbar h4 {
            font-size: 16px;
            color: var(--text-main);
        }

        .download-btn {
            background: #16a34a;
            color: #ffffff;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #15803d;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="deacons.html" class="back-btn">⬅ عودة لقسم الشمامسة</a>
        <h2 style="font-size: 16px; color: var(--primary);">مناهج اللغة القبطية (تحديث تلقائي)</h2>
        <div></div>
    </div>

    <!-- Main View -->
    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar" id="sidebarItems">
            <h3>ملفات المنهج</h3>
            <p class="loading-text">جاري تحميل الملفات من جوجل درايف...</p>
        </div>

        <!-- Viewer & Download Area -->
        <div class="viewer-area">
            <div class="viewer-toolbar">
                <h4 id="fileTitle">اختر ملفاً</h4>
                <a id="downloadLink" href="#" class="download-btn" target="_blank" style="display: none;">
                    📥 تحميل الملف
                </a>
            </div>
            <div class="iframe-container">
                <iframe id="pdfViewer" src=""></iframe>
            </div>
        </div>
    </div>

    <!-- Load Shared Deacons Config -->
    <script src="deacons-config.js"></script>
    <script>
        async function fetchCopticFiles() {
            const sidebar = document.getElementById('sidebarItems');
            try {
                // Fetch dynamically using DEACON_CONFIG from deacons-config.js
                const response = await fetch(`${DEACON_CONFIG.WEB_APP_URL}?action=getCopticFiles`);
                const data = await response.json();

                if (data.status === "success" && data.files.length > 0) {
                    let html = '<h3>ملفات المنهج</h3>';
                    data.files.forEach((file, index) => {
                        const activeClass = index === 0 ? 'active' : '';
                        html += `<button class="item-btn ${activeClass}" onclick="loadFile('${file.name.replace(/'/g, "\\'")}', '${file.id}', this)">
                                    <span>${file.name}</span> 📄
                                 </button>`;
                    });
                    sidebar.innerHTML = html;

                    // Load the first file by default
                    loadFile(data.files[0].name, data.files[0].id, sidebar.querySelector('.item-btn'));
                } else {
                    sidebar.innerHTML = '<h3>ملفات المنهج</h3><p class="loading-text">لا توجد ملفات PDF في هذا المجلد.</p>';
                }
            } catch (error) {
                console.error("Error fetching files:", error);
                sidebar.innerHTML = '<h3>ملفات المنهج</h3><p class="loading-text" style="color:red;">فشل جلب الملفات. تأكد من رابط الـ Web App في deacons-config.js.</p>';
            }
        }

        function loadFile(fileName, fileId, btnElement) {
            document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            document.getElementById('fileTitle').innerText = fileName;
            document.getElementById('pdfViewer').src = `https://drive.google.com/file/d/${fileId}/preview`;
            
            const downloadBtn = document.getElementById('downloadLink');
            downloadBtn.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
            downloadBtn.style.display = 'inline-flex';
        }

        // Fetch files automatically when the page loads
        window.onload = function() {
            fetchCopticFiles();
        };
    </script>

</body>
</html>
