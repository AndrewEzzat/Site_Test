<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الشمامسة - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #cbd5e1;
        }

        /* Main Content Container */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 24px;
            text-align: center;
        }

        /* Grid Cards Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.1);
        }

        .card h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .card p {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <a href="index.html" class="back-btn">⬅ العودة للرئيسية</a>
        <h2 style="font-size: 18px; color: var(--primary);">مدرسة الشمامسة</h2>
        <div></div>
    </div>

    <!-- Main Navigation Grid -->
    <div class="container">
        <h1 class="page-title">أقسام مدرسة الشمامسة</h1>
        
        <div class="grid">
            <!-- Coptic Curriculum -->
            <a href="deacon_viewer.html?type=coptic" class="card">
                <h3>📖 مناهج اللغة القبطية</h3>
                <p>تصفح وعرض ملفات المناهج الدراسية مباشرة من درايف</p>
            </a>

            <!-- Hymns Curriculum -->
            <a href="deacon_viewer.html?type=hymns" class="card">
                <h3>🎵 مناهج الألحان</h3>
                <p>متابعة ألحان ومردات الصلوات والطقوس الكنسية</p>
            </a>

            <!-- Attendance Dashboard Card -->
            <a href="deacon_attendance.html" class="card">
                <h3>📊 سجل الحضور والغياب</h3>
                <p>تسجيل ومتابعة حضور الشمامسة للفصول المختلفة</p>
            </a>
        </div>
    </div>

    <!-- Load the Deacons Shared Config -->
    <script src="deacons-config.js"></script>

</body>
</html>
